    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111111;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 45px 35px;
            background: #1b1b1b;
            border: 1px solid #333333;
            border-radius: 16px;
            text-align: center;

        }

        h1 {
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .subtitle {
            color: #999999;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .menu {
            display: block;
            padding: 18px;
            margin: 16px 0;
            background: #292929;
            border: 1px solid #3d3d3d;
            color: #ffffff;
            text-decoration: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .menu:hover {
            background: #ffffff;
            color: #111111;
            border-color: #ffffff;
            transform: translateY(-3px);
        }

        .line {
            width: 50px;
            height: 3px;
            background: #777777;
            margin: 0 auto 25px;
            border-radius: 10px;
        }

        footer {
            margin-top: 35px;
            color: #666666;
            font-size: 12px;
            letter-spacing: 1px;
        }
